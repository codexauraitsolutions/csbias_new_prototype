<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Daily Current Affairs Quiz — CSB IAS Academy</title>
<link rel="icon" href="assets/img/just_logo.png">
<link rel="stylesheet" href="assets/style.css">
<link rel="stylesheet" href="assets/v2.css">
</head>
<body data-page="quiz">
<main data-quiz-engine>
  <!-- Start -->
  <section class="phero" data-stage="start">
    <div class="wrap" style="max-width:760px">
      <nav class="crumbs" aria-label="Breadcrumb"><a href="index.html">Home</a><span>/</span><a href="quiz.html">Quizzes</a><span>/</span><span>Daily challenge</span></nav>
      <h1>Today's current affairs <em>challenge.</em></h1>
      <div class="meta" style="margin:20px 0 32px"><span class="pill">5 questions</span><span class="pill">8 minutes</span><span class="pill">+2 / −0.66</span></div>
      <form class="box form" data-quiz-start>
        <div class="row2"><div class="field"><label for="qn">Your name</label><input class="input" id="qn" required></div><div class="field"><label for="qe">Email</label><input class="input" id="qe" type="email" required></div></div>
        <button class="btn btn-saffron" type="submit">Start the quiz</button>
      </form>
    </div>
  </section>

  <!-- Running -->
  <section class="phero" data-stage="run" hidden>
    <div class="wrap qwrap">
      <div class="box" style="padding:clamp(22px,4vw,40px)">
        <div class="meta" style="justify-content:space-between"><span data-qn>Question 1 of 5</span><span>+2 marks · −0.66 negative</span></div>
        <div class="bar" style="margin-top:12px"><span data-qbar style="width:20%"></span></div>
        <h2 data-qt style="font-size:clamp(22px,2.6vw,30px);margin:28px 0 24px;line-height:1.3"></h2>
        <div data-qo style="display:grid;gap:10px"></div>
        <div style="display:flex;justify-content:space-between;gap:10px;margin-top:32px;flex-wrap:wrap"><button class="btn btn-ghost" type="button" data-prev>← Previous</button><button class="btn btn-ink" type="button" data-next>Next →</button></div>
      </div>
      <aside class="sticky box">
        <div style="display:flex;justify-content:space-between;align-items:center"><span class="eyebrow">Time left</span><span class="price" style="font-size:34px" data-timer>08:00</span></div>
        <h3 style="margin-top:24px;font-size:18px">Question palette</h3>
        <div class="qpal" data-qp></div>
        <div class="meta" style="margin-top:14px"><span><i style="display:inline-block;width:12px;height:12px;border-radius:4px;background:rgba(14,138,124,.3)"></i> Answered</span><span><i style="display:inline-block;width:12px;height:12px;border-radius:4px;border:1px solid var(--line)"></i> Not visited</span></div>
        <button class="btn btn-saffron" type="button" data-finish style="width:100%;margin-top:22px">Submit quiz</button>
      </aside>
    </div>
  </section>

  <!-- Result -->
  <section class="phero" data-stage="result" hidden>
    <div class="wrap" style="max-width:860px">
      <div class="box center" style="padding:48px 24px">
        <span class="eyebrow">Quiz complete</span>
        <div class="ring" style="--p:0%;margin-top:24px"><div><b data-score>0/5</b><span class="small muted">score</span></div></div>
        <p class="lead" style="margin-top:20px">Nice work! Review the explanations below.</p>
        <div style="display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin-top:24px"><a class="btn btn-ink" href="quiz-take.html">Retake</a><a class="btn btn-ghost" href="quiz.html">More quizzes</a></div>
      </div>
      <div data-review style="display:grid;gap:12px;margin-top:24px"></div>
    </div>
  </section>
</main>
<div id="site-footer"></div>
<script src="assets/app.js"></script>
</body>
</html>
